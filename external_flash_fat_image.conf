# Existing host-readable FAT volume holding one raw HFS or MFS Mac image.
# Never autoformat the current W25Q64 raw-HFS layout.
CONFIG_FLASH=y
CONFIG_FLASH_JESD216_API=y
CONFIG_FLASH_MAP=y
CONFIG_DISK_DRIVER_FLASH=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_MCX_MAC_EXTERNAL_FLASH_FAT_IMAGE=y
